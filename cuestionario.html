<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Evaluación Nutricional</title>

    <link rel="stylesheet" href="css/formulario.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="contenedor">

    <h1>Evaluación Nutricional</h1>

    <p>
        Completa el formulario para generar tu plan nutricional personalizado.
    </p>

    <form id="formulario">

        <h2>Datos personales</h2>

        <label for="nombre">Nombre completo</label>
        <input
            type="text"
            id="nombre"
            required>

        <label for="codigo">Carrera</label>
        <input
            type="text"
            id="carrera"
            required>

        <label for="codigo">Código universitario</label>
        <input
            type="text"
            id="codigo"
            required>

        <label for="sexo">Sexo</label>

        <select id="sexo">

            <option value="masculino">Masculino</option>

            <option value="femenino">Femenino</option>

        </select>

        <hr>

        <h2>Datos físicos</h2>

        <label for="peso">Peso (kg)</label>

        <input
            type="number"
            id="peso"
            min="1"
            step="0.1"
            required>

        <label for="altura">Altura (cm)</label>

        <input
            type="number"
            id="altura"
            min="1"
            required>

        <hr>

        <h2>Objetivo</h2>

        <select id="objetivo">

            <option value="bajar">
                Bajar de peso
            </option>

            <option value="mantener">
                Mantener peso
            </option>

            <option value="ganar">
                Ganar masa muscular
            </option>

        </select>

        <hr>

        <h2>Actividad física</h2>

        <select id="actividad">

            <option value="sedentario">
                Sedentario
            </option>

            <option value="ligera">
                Ligera
            </option>

            <option value="moderada">
                Moderada
            </option>

            <option value="alta">
                Alta
            </option>

        </select>

        <hr>

        <h2>Alergias</h2>

        <label>
            <input
                type="checkbox"
                class="alergia"
                value="Gluten">
            Gluten
        </label>

        <label>
            <input
                type="checkbox"
                class="alergia"
                value="Lactosa">
            Lactosa
        </label>

        <label>
            <input
                type="checkbox"
                class="alergia"
                value="Mariscos">
            Mariscos
        </label>

        <label>
            <input
                type="checkbox"
                class="alergia"
                value="Huevo">
            Huevo
        </label>

        <label for="alergia_otra">
            Otra alergia
        </label>

        <input
            type="text"
            id="alergia_otra"
            placeholder="Especificar">

        <hr>

        <h2>Enfermedades</h2>

        <label>
            <input
                type="checkbox"
                class="enfermedad"
                value="Diabetes">
            Diabetes
        </label>

        <label>
            <input
                type="checkbox"
                class="enfermedad"
                value="Hipertensión">
            Hipertensión
        </label>

        <label>
            <input
                type="checkbox"
                class="enfermedad"
                value="Colesterol Alto">
            Colesterol Alto
        </label>

        <label for="enfermedad_otra">
            Otra enfermedad
        </label>

        <input
            type="text"
            id="enfermedad_otra"
            placeholder="Especificar">

        <hr>

        <button
            type="submit"
            class="boton">

            Continuar

            <i class="fa-solid fa-arrow-right"></i>

        </button>

    </form>

</div>

<!-- IMPORTANTE -->
<script src="js/cuestionario.js"></script>

</body>
</html>
